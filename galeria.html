<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Galería de fotografías y actividades de la Fundación Columna de Fuego en Cochabamba, Bolivia. Amor en acción, ayuda social y fe compartida.">
  <meta name="keywords" content="galeria, fotos, actividades cristianas, ayuda social, Cochabamba, Bolivia">
  <meta name="author" content="Fundación Columna de Fuego">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Galería de Actividades | FUNDACIÓN COLUMNA DE FUEGO">
  <meta property="og:description" content="Visualiza momentos de servicio, oración, entrega comunitaria y ayuda al prójimo.">
  <meta property="og:locale" content="es_BO">

  <title>Galería | FUNDACIÓN COLUMNA DE FUEGO</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23B4232B'/><path d='M50 15 L50 85 M25 40 L75 40' stroke='%23C69A3A' stroke-width='10' stroke-linecap='round'/></svg>">
  <script type="module" crossorigin src="./assets/gallery-D_qZa_4n.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/animations-D25EQhSp.js">
  <link rel="stylesheet" crossorigin href="./assets/animations-GTrDwTjg.css">
  <link rel="stylesheet" crossorigin href="./assets/gallery-DfocLMwR.css">
</head>
<body>
  <div id="header-root"></div>

  <main id="main-content">
    <header class="page-hero">
      <div class="page-hero__container fade-in">
        <span class="page-hero__subtitle">Testimonio Visual</span>
        <h1 class="page-hero__title">Galería de Actividades</h1>
        <div class="section__divider"></div>
        <p class="page-hero__description">Instantáneas de amor, fe y servicio comunitario demostrando el amor de Dios en cada acción.</p>
      </div>
    </header>

    <section class="section gallery-section" id="gallery-app">
      <div class="container">
        <!-- Filtros de categoría -->
        <div class="gallery-toolbar fade-in" id="gallery-toolbar"></div>

        <!-- Mosaico de fotos -->
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>
    </section>

    <!-- Modal Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="lightbox__overlay" id="lightbox-overlay"></div>
      <button class="lightbox__close" id="lightbox-close" aria-label="Cerrar vista">✕</button>
      <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" aria-label="Foto anterior">‹</button>
      <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" aria-label="Foto siguiente">›</button>

      <div class="lightbox__content">
        <div class="lightbox__media-box">
          <img src="" alt="" class="lightbox__img" id="lightbox-img">
        </div>
        <div class="lightbox__caption" id="lightbox-caption"></div>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

</body>
</html>
